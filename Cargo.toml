[package]
name = "dimse"
version = "0.1.0"
edition = "2024"

[dependencies]
dicom = { version = ">=0.9.1" }
dicom-ul = {version = "0.9", features = ["async"]}
dicom-dictionary-std = { version = "0.9", features = ["sop-class"] }
tokio = { version = "1.49", features = ["signal", "macros", "rt-multi-thread", "fs", "net", "sync"] }
tracing = "0.1.44"
thiserror = "2.0.18"
num_enum = "0.7.4"
rand = "0.10.0"
strum_macros = "0.28.0"
clap = { version = "4.5.60", features = ["string", "derive"] }
tracing-subscriber = "0.3.22"
comfy-table = "7.2.2"
snafu = { version = "0.9.0", features = ["backtrace"] }
tokio-util = { version = "0.7.18", features = ["io-util"] }
futures = "0.3.32"

[dev-dependencies]
indicatif = "0.18.4"
glob-match = "0.2.1"
glob = "0.3"
