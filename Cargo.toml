[package]
name = "dimse"
version = "0.1.0"
edition = "2024"

[dependencies]
dicom = { git = "https://github.com/Enet4/dicom-rs.git" }
dicom-ul = {git = "https://github.com/Enet4/dicom-rs.git", features = ["async"]}
dicom-dictionary-std = { git = "https://github.com/Enet4/dicom-rs.git", features = ["sop-class"] }
tokio = { version = "1.49", features = ["signal", "macros", "rt-multi-thread", "fs", "net", "sync"] }
tracing = "0.1.44"
thiserror = "2.0.18"
num_enum = "0.7.4"
rand = "0.10.0"
strum = { version = "0.28.0", features = ["derive"] }
tracing-subscriber = "0.3.22"
comfy-table = "7.2.2"
snafu = { version = "0.9.0", features = ["backtrace"] }
tokio-util = { version = "0.7.18", features = ["io-util"] }
glob-match = "0.2.1"
futures = "0.3.32"

[dev-dependencies]
indicatif = "0.18.4"
glob = "0.3"
tempfile = "3.27.0"
clap = { version = "4.6", features = ["string", "derive"] }
